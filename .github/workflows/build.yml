name: Build

# Builds the installers for every platform. Each run keeps them as artifacts on its summary page,
# and a version tag also publishes them as a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".github/images/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: cloudstream-desktop-windows-x64
            files: |
              app/src-tauri/target/release/bundle/nsis/*.exe
              app/src-tauri/target/release/bundle/msi/*.msi
          - name: macOS (Apple Silicon)
            os: macos-latest
            artifact: cloudstream-desktop-macos-apple-silicon
            files: app/src-tauri/target/release/bundle/dmg/*.dmg
          # The bundled Java runtime is built for one architecture, so Intel needs its own build.
          - name: macOS (Intel)
            os: macos-15-intel
            artifact: cloudstream-desktop-macos-intel
            files: app/src-tauri/target/release/bundle/dmg/*.dmg
          # The oldest supported Ubuntu, so the packages also run on older distributions.
          - name: Linux
            os: ubuntu-22.04
            artifact: cloudstream-desktop-linux-x64
            files: |
              app/src-tauri/target/release/bundle/deb/*.deb
              app/src-tauri/target/release/bundle/rpm/*.rpm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file

      - name: Build the engine and its Java runtime
        working-directory: engine
        shell: bash
        run: ./gradlew shadowJar bundleJre --no-daemon

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build installers
        working-directory: app
        shell: bash
        run: |
          # macOS runners sometimes keep the disk image busy while making the .dmg, so try again.
          for attempt in 1 2 3; do
            npm run tauri build -- --config src-tauri/tauri.release.conf.json 2>&1 | tee build.log && exit 0
            [ "$RUNNER_OS" = macOS ] || exit 1
            hdiutil detach "/Volumes/CloudStream Desktop" -force || true
            sleep 30
          done
          exit 1

      # Puts the end of the log on the run's summary page, where it can be read without opening the job.
      - name: Show why the build failed
        if: failure()
        working-directory: app
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          echo "::error title=Build failed::$(tail -n 40 build.log | awk '{ printf "%s%%0A", $0 }')"

      - name: Check the installed app starts its engine
        shell: bash
        run: bash .github/scripts/check-app.sh

      - name: List built files
        shell: bash
        working-directory: app/src-tauri/target/release/bundle
        run: |
          find . -maxdepth 2 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \) |
            while read -r file; do echo "::notice::$file"; done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Runs only after every platform has passed, so a release never ships with a download missing.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # GitHub turns spaces in file names into dots, so give them names the notes can link to.
      - name: Name the files and fill in the notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir files
          # Artifacts holding two file types keep each in a subfolder, so search for the file.
          take() { mv "$(find "artifacts/cloudstream-desktop-$1" -name "*$2")" "files/CloudStream-Desktop-$version-$3"; }
          take windows-x64 .exe Windows-x64-Setup.exe
          take windows-x64 .msi Windows-x64.msi
          take macos-apple-silicon .dmg macOS-Apple-Silicon.dmg
          take macos-intel .dmg macOS-Intel.dmg
          take linux-x64 .deb Linux-x64.deb
          take linux-x64 .rpm Linux-x64.rpm
          sed "s/{{version}}/$version/g" .github/release-notes.md > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" files/* --verify-tag --title "CloudStream Desktop $GITHUB_REF_NAME" --notes-file notes.md
