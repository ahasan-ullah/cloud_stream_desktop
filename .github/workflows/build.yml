name: Build

# Builds the installers for every platform. Each run keeps them as artifacts on its summary page.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".github/images/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: cloudstream-desktop-windows-x64
            files: |
              app/src-tauri/target/release/bundle/nsis/*.exe
              app/src-tauri/target/release/bundle/msi/*.msi
          - name: macOS (Apple Silicon)
            os: macos-latest
            artifact: cloudstream-desktop-macos-apple-silicon
            files: app/src-tauri/target/release/bundle/dmg/*.dmg
          # The bundled Java runtime is built for one architecture, so Intel needs its own build.
          - name: macOS (Intel)
            os: macos-15-intel
            artifact: cloudstream-desktop-macos-intel
            files: app/src-tauri/target/release/bundle/dmg/*.dmg
          # The oldest supported Ubuntu, so the packages also run on older distributions.
          - name: Linux
            os: ubuntu-22.04
            artifact: cloudstream-desktop-linux-x64
            files: |
              app/src-tauri/target/release/bundle/deb/*.deb
              app/src-tauri/target/release/bundle/rpm/*.rpm
              app/src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libfuse2 file

      - name: Build the engine and its Java runtime
        working-directory: engine
        shell: bash
        run: ./gradlew shadowJar bundleJre --no-daemon

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build installers
        working-directory: app
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json

      - name: Check the packaged engine starts
        shell: bash
        run: bash .github/scripts/check-engine.sh

      - name: List built files
        shell: bash
        working-directory: app/src-tauri/target/release/bundle
        run: |
          find . -maxdepth 2 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) |
            while read -r file; do echo "::notice::$file"; done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
